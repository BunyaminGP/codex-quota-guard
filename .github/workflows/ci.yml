name: CI

"on":
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Syntax / compile check
        run: |
          python -m py_compile scripts/common.py scripts/notify.py scripts/process.py scripts/quota_gate.py scripts/run.py scripts/usage.py install.py

      - name: Python tests (pytest)
        run: python -m pytest -q
